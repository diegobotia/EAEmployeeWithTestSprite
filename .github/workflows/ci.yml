name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    # No ejecutar en PRs provenientes de forks porque
    # GitHub no entrega los Secrets a esos workflows.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. VERIFICAR SECRET
      # ============================================================

      - name: Verify TestSprite Secret
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |

          echo "=========================================="
          echo "Checking TestSprite API Key"
          echo "=========================================="

          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "❌ TESTSPRITE_API_KEY is EMPTY"
            echo ""
            echo "Check:"
            echo "GitHub → Settings → Secrets and variables"
            echo "→ Actions → TESTSPRITE_API_KEY"
            exit 1
          fi

          echo "✅ TESTSPRITE_API_KEY exists"
          echo "API Key length: ${#TESTSPRITE_API_KEY}"


      # ============================================================
      # 4. INSTALAR TESTSPRITE CLI
      # ============================================================

      - name: Install TestSprite CLI
        run: |
          npm install -g @testsprite/testsprite-cli


      # ============================================================
      # 5. TESTSPRITE DOCTOR
      # ============================================================

      - name: TestSprite Doctor
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |

          echo "=========================================="
          echo "Running TestSprite Doctor"
          echo "=========================================="

          testsprite doctor


      # ============================================================
      # 6. BUILD AND START APPLICATION
      # ============================================================

      - name: Build and start app containers
        run: |

          echo "Building Docker containers..."

          docker compose up -d --build

          echo ""
          echo "Docker containers:"
          docker compose ps


      # ============================================================
      # 7. WAIT FOR FRONTEND
      # ============================================================

      - name: Wait for frontend to be ready
        run: |

          echo "Waiting for frontend on port 5173..."

          timeout 60 bash -c \
            'until curl -s http://127.0.0.1:5173 > /dev/null 2>&1; do sleep 2; done'

          echo "✅ Frontend is ready"


      # ============================================================
      # 8. WAIT FOR BACKEND
      # ============================================================

      - name: Wait for backend to be ready
        run: |

          echo "Waiting for backend on port 4000..."

          timeout 60 bash -c \
            'until curl -s http://127.0.0.1:4000/employees > /dev/null 2>&1; do sleep 2; done'

          echo "✅ Backend is ready"


      # ============================================================
      # 9. CLOUDFLARE TUNNEL
      # ============================================================

      - name: Install and start Cloudflare Tunnel
        run: |

          echo "Installing cloudflared..."

          curl -sL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          echo "Starting Cloudflare Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:5173 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          sleep 10

          echo ""
          echo "Cloudflare log:"
          cat /tmp/cloudflared.log

          TUNNEL_URL=$(grep -o \
            'https://[^ ]*\.trycloudflare\.com' \
            /tmp/cloudflared.log \
            | head -1)

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not obtain Cloudflare Tunnel URL"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Cloudflare URL:"
          echo "$TUNNEL_URL"
          echo "=========================================="

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VERIFY CLOUDFLARE
      # ============================================================

      - name: Verify tunnel
        run: |

          echo "Testing:"
          echo "$TUNNEL_URL"

          curl -sI "$TUNNEL_URL" | head -10

          echo "✅ Cloudflare Tunnel is working"


      # ============================================================
      # 11. UPDATE TEST URLS
      # ============================================================

      - name: Rewrite TestSprite URLs
        run: |

          echo "Updating TestSprite test URLs..."

          find testsprite_tests \
            -name '*.py' \
            -exec sed -i \
            "s|http://127.0.0.1:5173|$TUNNEL_URL|g" {} +

          find testsprite_tests \
            -name '*.py' \
            -exec sed -i \
            "s|http://localhost:5173|$TUNNEL_URL|g" {} +

          echo ""
          echo "Checking URLs..."

          grep -R \
            'trycloudflare.com' \
            testsprite_tests \
            | head -10 \
            || echo "No Cloudflare URLs found"


      # ============================================================
      # 12. RUN TESTSPRITE ACTION
      # ============================================================

      - name: Run TestSprite Action
        uses: TestSprite/run-action@v1

        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base_url: ${{ env.TUNNEL_URL }}
          blocking: 'false'