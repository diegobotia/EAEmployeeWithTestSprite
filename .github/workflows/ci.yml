name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    # Evita ejecutar el workflow para PRs provenientes de forks,
    # donde GitHub no entrega los Secrets.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFICAR TESTSPRITE API KEY
      # ============================================================
      - name: Verify TestSprite API Key
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          echo "Checking TestSprite API Key..."

          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "❌ ERROR: TESTSPRITE_API_KEY is EMPTY"
            echo "Verify that the secret exists in:"
            echo "Repository → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ TESTSPRITE_API_KEY exists"
          echo "API Key length: ${#TESTSPRITE_API_KEY}"


      # ============================================================
      # 3. BUILD AND START APPLICATION
      # ============================================================
      - name: Build and start app containers
        run: |
          echo "Building and starting Docker containers..."

          docker compose up -d --build

          echo "Docker containers started"

          docker compose ps


      # ============================================================
      # 4. WAIT FOR FRONTEND
      # ============================================================
      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on port 5173..."

          timeout 60 bash -c \
            'until curl -s http://127.0.0.1:5173 > /dev/null 2>&1; do sleep 2; done'

          echo "✅ Frontend is up!"


      # ============================================================
      # 5. WAIT FOR BACKEND
      # ============================================================
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on port 4000..."

          timeout 60 bash -c \
            'until curl -s http://127.0.0.1:4000/employees > /dev/null 2>&1; do sleep 2; done'

          echo "✅ Backend is up!"


      # ============================================================
      # 6. INSTALL CLOUDFLARE TUNNEL
      # ============================================================
      - name: Install and start Cloudflare Tunnel
        run: |

          echo "Installing cloudflared..."

          curl -sL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          echo "Starting Cloudflare Tunnel..."

          cloudflared tunnel \
            --url http://127.0.0.1:5173 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          sleep 10

          echo "Cloudflare log:"
          cat /tmp/cloudflared.log

          # Obtener URL pública
          TUNNEL_URL=$(grep -o \
            'https://[^ ]*\.trycloudflare\.com' \
            /tmp/cloudflared.log \
            | head -1)

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ ERROR: Could not obtain Cloudflare Tunnel URL"
            exit 1
          fi

          echo "======================================"
          echo "Cloudflare Tunnel URL:"
          echo "$TUNNEL_URL"
          echo "======================================"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"


      # ============================================================
      # 7. VERIFY CLOUDFLARE TUNNEL
      # ============================================================
      - name: Verify tunnel is working
        run: |

          echo "Testing tunnel:"
          echo "$TUNNEL_URL"

          curl -sI "$TUNNEL_URL" | head -10

          echo "✅ Cloudflare Tunnel is responding"


      # ============================================================
      # 8. REWRITE URLS IN TESTSPRITE TESTS
      # ============================================================
      - name: Rewrite hardcoded URLs in test scripts
        run: |

          echo "Replacing frontend URLs with:"
          echo "$TUNNEL_URL"

          # Replace 127.0.0.1
          find testsprite_tests \
            -name '*.py' \
            -exec sed -i \
            "s|http://127.0.0.1:5173|$TUNNEL_URL|g" {} +

          # Replace localhost
          find testsprite_tests \
            -name '*.py' \
            -exec sed -i \
            "s|http://localhost:5173|$TUNNEL_URL|g" {} +

          echo ""
          echo "Checking replacements..."

          grep -R \
            'trycloudflare.com' \
            testsprite_tests \
            | head -10 \
            || echo "No Cloudflare URLs found"


      # ============================================================
      # 9. RUN TESTSPRITE
      # ============================================================
      - name: Run TestSprite Action
        uses: TestSprite/run-action@v1

        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base_url: ${{ env.TUNNEL_URL }}
          blocking: 'false'